# =========================================================================
# Render Static Site Blueprint Configuration
# Project: Detektif Cilik 3D: Misteri Kotak Hilang (HPPK 2)
# =========================================================================

services:
  - type: web
    name: detektif-cilik-3d
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
